name: storefront-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/**']

permissions:
  contents: read

concurrency:
  group: storefront-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_fixture
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: storefront_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_fixture -d storefront_ci_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Dummy values for this job's owned, empty PostgreSQL 17 service only. Not secrets.
      DATABASE_URL: postgresql://ci_fixture:ci_fixture_only@127.0.0.1:5432/storefront_ci_fixture?schema=public
      AUTH_SECRET: ci-placeholder-not-a-secret
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Generate Prisma client from current schema
        run: npm run prisma:generate
      - name: Push schema to owned empty CI fixture database
        run: npx prisma db push
      - name: Contract tests
        run: npm test
      - name: Full repository lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit --incremental false
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop + mobile)
        run: npm run test:browser
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Production build (default Next.js build)
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
